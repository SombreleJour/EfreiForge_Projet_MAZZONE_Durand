# Configuration de slf4j-simple : les traces sont écrites dans un fichier,
# la console reste réservée au menu de l'application.

org.slf4j.simpleLogger.logFile=efreiforge.log
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss
